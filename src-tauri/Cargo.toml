[package]
name = "cowork-space"
version = "0.1.0"
edition = "2021"

[lib]
name = "cowork_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSArray", "NSString", "NSError", "NSPredicate"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKTypes", "EKObject", "block2"] }
block2 = "0.6"
