<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Planbuch (ursprünglich ein Claude-Artifact). Cowork Space stellt Speicher und Downloads über bridge.js bereit. -->
<script src="bridge.js"></script>
<title>Planbuch 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: App-Rahmen mit Seitenleiste (Desktop) bzw. Tab-Leiste (Handy); Stundenraster auf Karopapier mit rotem Heftrand */
:root{
  --bg:#f2f5f9; --paper:#ffffff; --ink:#172031; --muted:#5b687c; --faint:#8b97a8;
  --line:#d9e0ea; --grid:#e9eef5; --accent:#2446b0; --accent-ink:#ffffff; --accent-soft:#e4eafb;
  --margin:#d6453d; --holiday:#eceff4; --ok:#1d7f54; --warn:#a86b10; --bad:#c03a12;
  --shadow:0 1px 2px rgba(20,32,60,.06),0 8px 24px rgba(20,32,60,.08);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --paper:#161b25; --ink:#e6ebf3; --muted:#9ba8bc; --faint:#6d7a8e;
  --line:#2a3342; --grid:#1c2330; --accent:#93abff; --accent-ink:#0f1730; --accent-soft:#1f2946;
  --margin:#f07a70; --holiday:#1a202b; --ok:#4dc48c; --warn:#e2a94b; --bad:#f28a62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --paper:#161b25; --ink:#e6ebf3; --muted:#9ba8bc; --faint:#6d7a8e;
  --line:#2a3342; --grid:#1c2330; --accent:#93abff; --accent-ink:#0f1730; --accent-soft:#1f2946;
  --margin:#f07a70; --holiday:#1a202b; --ok:#4dc48c; --warn:#e2a94b; --bad:#f28a62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* App-Rahmen */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--grid);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--faint)}
main{min-width:0;padding-inline:28px;padding-block:22px 48px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:clamp(22px,3vw,30px);letter-spacing:-.015em}
.topbar .sub{color:var(--muted);font-size:14px}
.spacer{flex:1}
.status{font-size:12.5px;color:var(--faint);min-height:1em}
.status.err{color:var(--bad)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:14px}

/* Buttons & Felder */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn svg{width:16px;height:16px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--faint))}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--grid);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center;background:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.section > h2{font-size:18px}
.hint{color:var(--muted);font-size:13.5px;margin:0}

/* Wochenraster */
.week{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.wgrid{display:grid;grid-template-columns:72px repeat(5,minmax(0,1fr));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.wh{padding:10px 10px 8px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:5px;min-width:0}
.wh .d{font-weight:700;font-family:var(--display);font-size:15px}
.wh .d small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12px;margin-left:5px}
.wh.today .d{color:var(--accent)}
.wh .ev{display:flex;flex-direction:column;gap:3px}
.evp{font-size:12px;line-height:1.3;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;text-align:left}
.evp.kind-Schularbeit,.evp.kind-Test{background:color-mix(in srgb,var(--margin) 16%,var(--paper))}
.tc{border-right:2px solid var(--margin);padding:8px 8px;background:var(--paper);display:flex;flex-direction:column;align-items:flex-end;gap:1px;border-bottom:1px solid var(--line)}
.tc b{font-family:var(--display);font-size:16px}
.tc span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px;min-height:74px;min-width:0;display:flex}
.cell.hol{background:repeating-linear-gradient(-45deg,var(--holiday),var(--holiday) 6px,transparent 6px,transparent 12px);background-color:var(--paper)}
.cell.hol .holl{font-size:12px;color:var(--muted);font-weight:600;padding:4px}
.slot{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;text-align:left;padding:7px 8px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--c) 11%,var(--paper));border-color:color-mix(in srgb,var(--c) 28%,var(--paper))}
.slot:hover{border-color:var(--c)}
.slot .cn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.slot .tp{font-size:13px;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .tp.none{color:var(--faint);font-style:italic}
.slot .hw{font-size:11.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot.st-entfaellt{opacity:.55}
.slot.st-entfaellt .tp{text-decoration:line-through}
.slot .ok{color:var(--ok)}
.addslot{flex:1;border:1px dashed transparent;background:none;border-radius:8px;color:var(--faint);font-size:20px;opacity:0}
.cell:hover .addslot,.addslot:focus-visible{opacity:1;border-color:var(--line)}
.wfoot{display:flex;gap:14px;flex-wrap:wrap;padding:12px 2px;color:var(--muted);font-size:13px}
.daytabs{display:none}
.daylist{display:none}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.dhead h2{font-size:19px}
.dhead .meta{color:var(--muted);font-size:13px}
.dbody{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--paper)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yphint{border-left:3px solid var(--margin);background:var(--paper);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.yphint b{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block}
.flow{width:100%;border-collapse:collapse;font-size:14px}
.flowwrap{overflow-x:auto}
.flow th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 4px;font-weight:600}
.flow td{padding:3px 3px;vertical-align:top}
.flow td input,.flow td textarea{padding:6px 7px;font-size:14px}
.flow td textarea{min-height:38px}
.flow .w-min{width:62px}.flow .w-ph{width:110px}.flow .w-sf{width:96px}.flow .w-x{width:34px}
.links{display:flex;flex-direction:column;gap:6px}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:6px;align-items:center}
.openlink{font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
.picker{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:12px;display:flex;flex-direction:column;gap:8px}
.picker ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:flex;flex-direction:column}
.picker li button{width:100%;border:0;background:none;text-align:left;padding:8px 6px;border-radius:6px;display:flex;gap:10px;align-items:baseline}
.picker li button:hover{background:var(--grid)}
.picker li .mono{font-size:12px;color:var(--muted);flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 11px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Jahresplan */
.yp{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.yp th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.yp td{padding:6px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
.yp tr:last-child td{border-bottom:0}
.yp td.kw{width:56px;font-family:var(--mono);font-weight:500;color:var(--muted);border-right:2px solid var(--margin)}
.yp td.dt{width:150px;font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.yp tr.now td{background:var(--accent-soft)}
.yp tr.holw td{background:var(--holiday)}
.yp input{border-color:transparent;background:transparent}
.yp input:hover{border-color:var(--line)}
.yp .ht{font-size:12px;color:var(--muted);font-weight:600}
.ypwrap{overflow-x:auto}

/* Termine */
.month{display:flex;flex-direction:column;gap:6px}
.month h3{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.evrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.evrow .when{font-family:var(--mono);font-size:13px;color:var(--muted)}
.evrow .what{min-width:0}
.evrow .what b{font-weight:600}
.evrow.hol{background:var(--holiday);border-style:dashed}
.addform{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;padding:14px}
.addform .span2{grid-column:span 2}.addform .span3{grid-column:span 3}

/* Notenbuch */
.gbwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.gb{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
.gb th,.gb td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:0;text-align:center;white-space:nowrap}
.gb thead th{background:var(--paper);position:sticky;top:0;z-index:1;vertical-align:bottom}
.gb .st{position:sticky;left:0;background:var(--paper);z-index:2;text-align:left;padding:6px 12px;font-family:var(--mono);font-weight:500;border-right:2px solid var(--margin);min-width:92px}
.gb thead .st{z-index:3}
.colh{border:0;background:none;padding:6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;width:100%}
.colh .k{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:4px}
.k-mitarbeit{background:var(--accent-soft);color:var(--accent)}
.k-pruefung{background:color-mix(in srgb,var(--margin) 18%,var(--paper));color:var(--margin)}
.k-hue{background:color-mix(in srgb,var(--ok) 16%,var(--paper));color:var(--ok)}
.k-check{background:color-mix(in srgb,var(--warn) 18%,var(--paper));color:var(--warn)}
.colh .t{font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.colh .dd{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gc{border:0;background:none;width:100%;min-width:48px;height:38px;font-size:16px;font-weight:700}
.gc:hover{background:var(--grid)}
.v-plus{color:var(--ok)}.v-tilde{color:var(--warn)}.v-minus{color:var(--bad)}.v-yes{color:var(--ok)}.v-no{color:var(--bad)}
.gi{width:48px;height:38px;border:0;text-align:center;font-family:var(--mono);font-size:15px;background:transparent;border-radius:0;padding:0}
.gi:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.sum{font-family:var(--mono);font-size:13px;padding:6px 10px !important;color:var(--muted);background:var(--bg)}
.sum b{color:var(--ink)}
.gbtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inlineform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 90px auto auto;gap:8px;align-items:end;padding:12px}

/* Einstellungen */
.setrows{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;gap:8px;align-items:center}
.setrow.cls{grid-template-columns:44px minmax(0,1.3fr) minmax(0,1fr) auto 36px}
.setrow.per{grid-template-columns:40px 1fr 1fr 36px}
.setrow.hol{grid-template-columns:1fr 1fr minmax(0,1.6fr) 36px}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--paper)}
.ttwrap{overflow-x:auto}
.tt{border-collapse:collapse;min-width:640px;width:100%;background:var(--paper);border:1px solid var(--line)}
.tt th{font-size:12px;color:var(--muted);padding:8px;text-align:left;border-bottom:1px solid var(--line)}
.tt td{padding:4px;border-bottom:1px solid var(--grid)}
.tt td:first-child{font-family:var(--mono);color:var(--muted);font-size:13px;width:70px;padding-left:10px;border-right:2px solid var(--margin)}
.tt select{padding:6px 7px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Anwesenheit */
.att{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.atthead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.attsum{display:inline-flex;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.attsum span{display:inline-flex;align-items:center;gap:3px}
.attsum svg,.ab svg,.ac svg,.gb th svg{width:15px;height:15px}
.attlist{display:flex;flex-direction:column}
.attrow{display:grid;grid-template-columns:74px auto minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid)}
.attrow:last-child{border-bottom:0}
.attrow .code{font-family:var(--mono);font-weight:500;font-size:14px}
.attbtns{display:inline-flex;gap:4px}
.ab{width:38px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--paper);border-radius:8px;color:var(--faint);padding:0}
.ab:hover{border-color:var(--faint)}
.ab.a-p[aria-pressed="true"]{background:color-mix(in srgb,var(--ok) 16%,var(--paper));border-color:var(--ok);color:var(--ok)}
.ab.a-m[aria-pressed="true"]{background:color-mix(in srgb,var(--bad) 14%,var(--paper));border-color:var(--bad);color:var(--bad)}
.ab.a-l[aria-pressed="true"]{background:color-mix(in srgb,var(--warn) 16%,var(--paper));border-color:var(--warn);color:var(--warn)}
.ab.a-e[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.attx{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);min-width:0}
.exc{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--bad)}
.exc[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.attmin{width:62px !important;padding:4px 7px !important;font-size:14px !important;font-family:var(--mono)}
.ac{border:0;background:none;width:100%;min-width:44px;height:38px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;padding:0}
.ac:hover{background:var(--grid)}
.ac .in{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.c-p{color:var(--ok)}.c-m{color:var(--bad)}.c-l{color:var(--warn)}.c-e{color:var(--accent)}
.ue{font-size:10px;font-weight:700;letter-spacing:.02em}
.gb th .dh{display:flex;flex-direction:column;align-items:center;padding:6px 4px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.2}
.gb th .dh b{color:var(--ink);font-size:11.5px}
.gb tfoot td{font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 4px;background:var(--bg)}
.slot .ai{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.attchk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Eigene Listen */
.modebar{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-width:0}
.seg-scroll{max-width:100%;overflow-x:auto;scrollbar-width:none}

<script>
(function(){
"use strict";
/* ---------- Grunddaten ---------- */
const PALETTE=['#2f6fdb','#d0563f','#2f9e6e','#9a5bd1','#c58a12','#1e9bb0','#c2477f','#6b7a2a','#5b6b8c','#b5651d'];
const DEFAULTS={
  schoolYear:'2026/27', yearStart:'2026-09-14', yearEnd:'2027-07-09',
  abWeeks:false, abStart:'2026-09-14',
  periods:[{n:1,start:'07:45',end:'08:35'},{n:2,start:'08:35',end:'09:25'},{n:3,start:'09:40',end:'10:30'},{n:4,start:'10:30',end:'11:20'},{n:5,start:'11:30',end:'12:20'},{n:6,start:'12:20',end:'13:10'},{n:7,start:'13:50',end:'14:40'},{n:8,start:'14:40',end:'15:30'}],
  classes:[],
  holidays:[
    {from:'2026-10-26',to:'2026-10-26',label:'Nationalfeiertag'},
    {from:'2026-10-27',to:'2026-10-31',label:'Herbstferien'},
    {from:'2026-11-02',to:'2026-11-02',label:'Allerseelen'},
    {from:'2026-12-08',to:'2026-12-08',label:'Mariä Empfängnis'},
    {from:'2026-12-24',to:'2027-01-06',label:'Weihnachtsferien'},
    {from:'2027-02-15',to:'2027-02-20',label:'Semesterferien'},
    {from:'2027-03-20',to:'2027-03-29',label:'Osterferien'},
    {from:'2027-05-04',to:'2027-05-04',label:'Hl. Florian (Landespatron)'},
    {from:'2027-05-06',to:'2027-05-06',label:'Christi Himmelfahrt'},
    {from:'2027-05-15',to:'2027-05-17',label:'Pfingstferien'},
    {from:'2027-05-27',to:'2027-05-27',label:'Fronleichnam'},
    {from:'2027-07-10',to:'2027-09-12',label:'Sommerferien'}
  ]
};
const DAYS=['Mo','Di','Mi','Do','Fr'];
const DAYNAMES=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
const KINDS={mitarbeit:'MA',pruefung:'NOTE',hue:'HÜ',check:'✓'};
const KINDNAMES={mitarbeit:'Mitarbeit',pruefung:'Schularbeit / Test',hue:'Hausübung',check:'Checkliste'};
const SV=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const AIC={p:SV('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),m:SV('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'),l:SV('<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>'),e:SV('<path d="M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4M14 8l4 4-4 4M18 12H9"/>')};
const ALB={p:'anwesend',m:'abwesend',l:'verspätet',e:'früher weg'};
const hasAtt=id=>{const c=S.settings.classes.find(x=>x.id===id);return !!(c&&c.att)};
function attLabel(a){if(!a||!a.t)return 'offen';let s=ALB[a.t];if(a.t==='l'||a.t==='e')s+=' ('+(a.min||5)+' min)';if(a.t==='m'||a.t==='l')s=(a.ex?'entschuldigt ':'unentschuldigt ')+s;return s}
function attCount(att,studs){const c={p:0,m:0,ue:0,l:0,e:0,o:0};(studs||[]).forEach(s=>{const a=att&&att[s.id];if(!a||!a.t){c.o++;return}c[a.t]++;if(a.t==='m'&&!a.ex)c.ue++});return c}
async function loadRoster(c){if(S.rosters[c])return S.rosters[c];if(!S.db)return null;try{const s=await S.db.doc('roster/'+c).get();S.rosters[c]=s.exists?s.data():{students:[]}}catch(e){S.rosters[c]={students:[]}}return S.rosters[c]}
const EVKINDS=['Termin','Schularbeit','Test','Konferenz','Elterngespräch','Ausflug','Fortbildung','Sonstiges'];
const PHASES=['Einstieg','Erarbeitung','Übung','Sicherung','Reflexion','Bewegung','Abschluss'];
const SOZ=['EA','PA','GA','Plenum','Stationen','LV'];

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const isoWeek=s=>{const d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
const fmt=(s,o)=>parse(s).toLocaleDateString('de-AT',o);
const dm=s=>{const d=parse(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const todayStr=()=>ymd(new Date());
const safeUrl=u=>{u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u};

/* ---------- Zustand ---------- */
const S={
  db:null, dbState:'connecting', settings:JSON.parse(JSON.stringify(DEFAULTS)), settingsLoaded:false,
  tt:{A:{},B:{}}, lessons:{}, events:[], yearplan:{}, view:'woche',
  week:null, day:0, ypClass:null, nbClass:null, roster:null, columns:[], showPast:false,
  unsub:{}, drawer:null, nbForm:null, editCol:null, rosters:{}, nbMode:'noten', attLessons:{}
};
(function initWeek(){const t=todayStr();const d=parse(t).getDay();let m=mondayOf(t);let di=(d+6)%7;if(di>4){m=addDays(m,7);di=0}S.week=m;S.day=di})();
try{const v=localStorage.getItem('pb-view');if(v)S.view=v}catch(e){}

const cls=id=>S.settings.classes.find(c=>c.id===id);
const clsName=id=>{const c=cls(id);return c?c.name:'—'};
const clsColor=id=>{const c=cls(id);return c?c.color:'#8b97a8'};
function holidayOf(s){for(const h of S.settings.holidays||[]){if(s>=h.from&&s<=h.to)return h.label}return null}
function weekType(mon){if(!S.settings.abWeeks)return 'A';const a=parse(mondayOf(S.settings.abStart||S.settings.yearStart));const diff=Math.round((parse(mon)-a)/(7*864e5));return ((diff%2)+2)%2===0?'A':'B'}
function slotFor(date,n){const dow=(parse(date).getDay()+6)%7;const tbl=S.tt[weekType(mondayOf(date))]||{};return tbl[(dow+1)+'-'+n]||null}

/* ---------- Speichern ---------- */
const queues={},timers={},pending={};
function setStatus(t,err){const el=$('#savestate');if(el){el.textContent=t;el.classList.toggle('err',!!err)}const s2=$('#dstatus');if(s2){s2.textContent=t;s2.classList.toggle('err',!!err)}}
function report(e){const code=e&&e.code;if(code==='quota_exceeded')toast('Speicher voll: '+(e.message||'Bitte alte Einträge löschen.'));else if(code==='invalid_argument')toast('Nur die Besitzerin dieser App kann speichern.');setStatus('Nicht gespeichert',true)}
function queued(path,fn){const p=(queues[path]||Promise.resolve()).then(fn);queues[path]=p.catch(()=>{});return p}
function write(path,fn){if(!S.db){toast('Speichern ist in dieser Ansicht nicht verfügbar.');return Promise.resolve()}setStatus('Speichert …');return queued(path,fn).then(()=>setStatus('Alles gespeichert')).catch(report)}
function saveLater(path,getData,ms){clearTimeout(timers[path]);setStatus('Ungespeicherte Änderung …');pending[path]=()=>{delete pending[path];const d=getData();return write(path,()=>S.db.doc(path).set(d))};timers[path]=setTimeout(pending[path],ms||700)}
function flush(){for(const k of Object.keys(pending)){clearTimeout(timers[k]);pending[k]()}}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------- Download (für Druck/Export) ---------- */
async function download(filename,data){
  const dl=window.claude&&await window.claude.use('downloads');
  if(!dl){toast('Download ist in dieser Ansicht nicht verfügbar.');return}
  try{await dl.save({filename,data})}catch(e){if(e&&e.code!=='declined')toast('Download nicht möglich: '+(e.message||e.code))}
}
function printDoc(title,body){
  return '<!doctype html><html lang="de"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+
  '@page{size:A4;margin:14mm}body{font:11pt/1.45 "Segoe UI",Arial,sans-serif;color:#111;margin:0 auto;max-width:190mm;padding:12mm 0}'+
  'h1{font-size:18pt;margin:0 0 2mm}h2{font-size:12pt;margin:6mm 0 2mm;border-bottom:1px solid #999;padding-bottom:1mm}.meta{color:#555;margin-bottom:5mm}'+
  'table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:2mm;vertical-align:top;text-align:left;font-size:10pt}th{background:#eee}'+
  '.hol{background:#f1f1f1;color:#666;font-style:italic}.pre{white-space:pre-wrap}.small{font-size:9pt;color:#555}'+
  '.hint{background:#f4f4f4;padding:3mm;margin-bottom:5mm;font-size:9pt}@media print{.hint{display:none}}'+
  '</style></head><body><div class="hint">Zum Drucken oder als PDF speichern: ⌘P.</div>'+body+'</body></html>';
}

/* ---------- Store-Verbindung ---------- */
function sub(key,fn){if(S.unsub[key]){S.unsub[key]();delete S.unsub[key]}if(fn)S.unsub[key]=fn()}
async function connect(){
  if(!window.claude||!window.claude.use){S.dbState='none';setStatus('Nur Ansicht');render();return}
  let db=null;try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){S.dbState='none';setStatus('Speichern nicht verfügbar',true);render();return}
  S.db=db;S.dbState='ok';setStatus('Alles gespeichert');
  sub('settings',()=>db.doc('plan/settings').onSnapshot(s=>{
    if(s.exists){const d=s.data();S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(JSON.stringify(d)));}
    S.settingsLoaded=true;$('#brandsub').textContent='Schuljahr '+S.settings.schoolYear;
    if(!S.ypClass&&S.settings.classes[0])S.ypClass=S.settings.classes[0].id;
    if(!S.nbClass&&S.settings.classes[0]){S.nbClass=S.settings.classes[0].id;subNotebook()}
    else if(S.nbClass&&hasAtt(S.nbClass)!==!!S.unsub.attlessons)subNotebook();
    softRender('settings');
  },report));
  sub('tt',()=>db.doc('plan/timetable').onSnapshot(s=>{S.tt=s.exists?Object.assign({A:{},B:{}},s.data()):{A:{},B:{}};softRender('tt')},report));
  sub('events',()=>db.collection('events').orderBy('date').limit(1000).onSnapshot(q=>{S.events=q.docs.map(d=>Object.assign({id:d.id},d.data()));softRender('events')},report));
  sub('yearplan',()=>db.collection('yearplan').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.yearplan=o;softRender('yearplan')},report));
  subWeek();
}
function subWeek(){
  if(!S.db)return;const mon=S.week,fri=addDays(mon,4);
  sub('lessons',()=>S.db.collection('lessons').where('date','>=',mon).where('date','<=',fri).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.lessons=o;softRender('lessons')},report));
}
function subNotebook(){
  if(!S.db||!S.nbClass)return;const c=S.nbClass;
  sub('roster',()=>S.db.doc('roster/'+c).onSnapshot(s=>{S.roster=s.exists?s.data():{students:[]};S.rosters[c]=S.roster;softRender('roster')},report));
  sub('columns',()=>S.db.collection('columns').where('classId','==',c).onSnapshot(q=>{S.columns=q.docs.map(d=>Object.assign({id:d.id},d.data()));softRender('columns')},report));
  sub('lists',()=>S.db.collection('lists').where('classId','==',c).onSnapshot(q=>{S.lists=q.docs.map(d=>Object.assign({id:d.id},d.data()));softRender('lists')},report));
  if(hasAtt(c))sub('attlessons',()=>S.db.collection('lessons').where('classId','==',c).limit(1000).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.attLessons=o;softRender('attlessons')},report));
  else{sub('attlessons');S.attLessons={}}
}
/* Re-render nur, wenn nicht gerade in diesem Bereich getippt wird */
function softRender(what){
  const a=document.activeElement;const typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&$('#main').contains(a);
  if(typing&&(S.view==='jahr'||S.view==='einst'||S.view==='termine'||S.view==='noten')){
    if(S.view==='jahr'&&what==='yearplan')return; if(S.view==='einst')return; if(S.view==='noten'&&(what==='columns'||what==='roster'||what==='lists'))return;
  }
  render();
}

/* ---------- Navigation ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;S.view=b.dataset.view;S.lpick=null;drawPicker();try{localStorage.setItem('pb-view',S.view)}catch(x){}render();window.scrollTo(0,0)});

function render(){
  document.querySelectorAll('#nav button[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===S.view?'page':'false'));
  const m=$('#main');
  const banner=S.dbState==='none'?'<div class="banner">Speichern ist gerade nicht verfügbar. Starte Cowork Space neu.</div>':'';
  const v={woche:viewWeek,jahr:viewYear,noten:viewNotebook,termine:viewEvents,einst:viewSettings}[S.view]||viewWeek;
  const sy=window.scrollY;m.innerHTML=banner+v();window.scrollTo(0,sy);
  bindView();
}

/* ---------- Woche ---------- */
function viewWeek(){
  const mon=S.week,fri=addDays(mon,4),wt=weekType(mon);const today=todayStr();
  const days=[0,1,2,3,4].map(i=>addDays(mon,i));
  const P=S.settings.periods;
  const evOf=d=>S.events.filter(e=>d>=e.date&&d<=(e.end||e.date));
  let h='<div class="topbar"><div><h1>KW '+isoWeek(mon)+'</h1><div class="sub">'+fmt(mon,{day:'numeric',month:'long'})+' – '+fmt(fri,{day:'numeric',month:'long',year:'numeric'})+(S.settings.abWeeks?' · <b>'+wt+'-Woche</b>':'')+'</div></div><div class="spacer"></div>'+
    '<button class="iconbtn" data-act="wprev" aria-label="Vorige Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '<button class="btn" data-act="wtoday">Heute</button>'+
    '<button class="iconbtn" data-act="wnext" aria-label="Nächste Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>'+
    '<button class="btn" data-act="wprint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z"/></svg>Woche drucken</button></div>';
  const noTT=!Object.keys(S.tt.A||{}).length&&!Object.keys(S.tt.B||{}).length;
  if(!S.settings.classes.length)h+='<div class="banner">Noch keine Klassen angelegt. Unter <b>Einstellungen</b> trägst du Klassen und Stundenplan ein.</div>';

  data.date=date;data.period=n;if(!data.flow)data.flow=[];if(!data.links)data.links=[];if(!data.att)data.att={};
  ['topic','goals','material','hw','notes'].forEach(k=>{if(data[k]==null)data[k]=''});

function ensureDrawerRoster(){

function readLesson(){
  const D=S.drawer;if(!D)return;const d=D.data;
  const v=id=>{const e=document.getElementById(id);return e?e.value:''};
  d.classId=v('lclass');d.status=v('lstatus');d.topic=v('ltopic');d.goals=v('lgoals');d.material=v('lmat');d.hw=v('lhw');d.notes=v('lnotes');

}
function saveLesson(ms){const D=S.drawer;if(!D)return;readLesson();D.isNew=false;const data=Object.assign({},D.data,{updated:new Date().toISOString()});S.lessons[D.key]=data;saveLater('lessons/'+D.key,()=>data,ms)}

function schoolWeeks(){const out=[];let m=mondayOf(S.settings.yearStart);const end=S.settings.yearEnd;while(m<=end){out.push(m);m=addDays(m,7)}return out}

function saveYear(){const c=S.ypClass;if(!c)return;const weeks={};document.querySelectorAll('[data-week]').forEach(i=>{if(i.value.trim())weeks[i.dataset.week]=i.value.trim()});S.yearplan[c]={classId:c,weeks};saveLater('yearplan/'+c,()=>({classId:c,weeks}),900)}

function viewEvents(){
  const t=todayStr();
  let h='<div class="topbar"><div><h1>Termine</h1><div class="sub">Schularbeiten, Konferenzen, Ausflüge, Elterngespräche</div></div></div>';
  h+='<div class="card addform" id="evform"><label class="f">Datum<input type="date" id="evdate" value="'+t+'"></label><label class="f">bis (optional)<input type="date" id="evend"></label><label class="f">Uhrzeit<input type="time" id="evtime"></label><label class="f span3">Titel<input type="text" id="evtitle" placeholder="z. B. 1. Schularbeit Deutsch"></label><label class="f">Art<select id="evkind">'+EVKINDS.map(k=>'<option>'+k+'</option>').join('')+'</select></label><label class="f">Klasse<select id="evclass"><option value="">—</option>'+S.settings.classes.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select></label><label class="f span2">Notiz<input type="text" id="evnote" placeholder="Raum, Mitbringen …"></label><button class="btn primary" data-act="evadd">Termin eintragen</button></div>';
  const list=S.events.map(e=>Object.assign({type:'ev'},e)).concat((S.settings.holidays||[]).map(x=>({type:'hol',date:x.from,end:x.to,title:x.label})));
  list.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const vis=list.filter(e=>S.showPast||(e.end||e.date)>=t);
  h+='<div style="display:flex;align-items:center;gap:10px;margin:20px 0 4px"><h2 style="font-size:18px">'+(S.showPast?'Alle Termine':'Kommende Termine')+'</h2><span class="spacer"></span><button class="btn sm ghost" data-act="evpast">'+(S.showPast?'Nur kommende':'Auch vergangene zeigen')+'</button></div>';
  if(!vis.length)return h+'<div class="empty">Noch keine Termine. Trag oben den ersten ein, oder wir übernehmen sie später aus Mein Schulplan.</div>';
  let curM='';
  vis.forEach(e=>{const mo=fmt(e.date,{month:'long',year:'numeric'});if(mo!==curM){if(curM)h+='</div>';h+='<div class="month"><h3>'+esc(mo)+'</h3>';curM=mo}
    const when=fmt(e.date,{weekday:'short'})+' '+dm(e.date)+(e.end&&e.end!==e.date?'–'+dm(e.end):'');
    if(e.type==='hol')h+='<div class="evrow hol"><span class="when">'+when+'</span><span class="what"><b>'+esc(e.title)+'</b></span><span class="tag">schulfrei</span></div>';
    else h+='<div class="evrow"><span class="when">'+when+(e.time?'<br>'+esc(e.time):'')+'</span><span class="what"><b>'+esc(e.title)+'</b><div class="hint">'+esc(e.kind||'')+(e.classId?' · '+esc(clsName(e.classId)):'')+(e.note?' · '+esc(e.note):'')+'</div></span><button class="btn sm ghost danger" data-act="evdel" data-id="'+esc(e.id)+'">'+(S.confirmEv===e.id?'Wirklich löschen?':'Löschen')+'</button></div>';
  });
  return h+'</div>';
}

function viewNotebook(){
  const C=S.settings.classes;
  let h='<div class="topbar"><div><h1>Notenbuch</h1><div class="sub">Mitarbeit, Schularbeiten &amp; Tests, Hausübungen, eigene Checklisten</div></div></div>';
  if(!C.length)return h+'<div class="empty">Leg zuerst unter Einstellungen deine Klassen an.</div>';
  h+='<div class="chips" style="margin-bottom:14px">'+C.map(c=>'<button class="chip" data-act="nbclass" data-id="'+esc(c.id)+'" aria-pressed="'+(c.id===S.nbClass)+'"><span class="dot" style="--c:'+esc(c.color)+'"></span>'+esc(c.name)+'</button>').join('')+'</div>';
  const R=S.roster;
  if(!R)return h+'<div class="empty">Lade Klasse …</div>';
  const studs=R.students||[];
  if(!studs.length||S.editRoster){
    return h+'<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><h2 style="font-size:17px">Schülerliste '+esc(clsName(S.nbClass))+'</h2><p class="hint">Eine Zeile pro Schüler:in, nur mit Katalognummer oder Kürzel (z. B. „01 AM“). Klarnamen bitte nicht eintragen.</p><textarea id="rostertxt" rows="10" class="mono" placeholder="01 AM&#10;02 BK&#10;03 CL">'+esc(studs.map(s=>s.code).join('\n'))+'</textarea><div style="display:flex;gap:8px"><button class="btn primary" data-act="rostersave">Liste speichern</button>'+(studs.length?'<button class="btn ghost" data-act="rostercancel">Abbrechen</button>':'')+'</div></div>';
  }
  const att=hasAtt(S.nbClass);const lists=(S.lists||[]).slice().sort((a,b)=>(a.created||'')<(b.created||'')?-1:1);
  let mode=S.nbMode;if(mode==='anw'&&!att)mode='noten';if(mode.startsWith('list:')&&!lists.find(l=>'list:'+l.id===mode))mode='noten';
  h+='<div class="modebar"><div class="seg seg-scroll" role="group" aria-label="Ansicht"><button data-act="nbmode" data-v="noten" aria-pressed="'+(mode==='noten')+'">Noten</button>'+(att?'<button data-act="nbmode" data-v="anw" aria-pressed="'+(mode==='anw')+'">Anwesenheit</button>':'')+lists.map(l=>'<button data-act="nbmode" data-v="list:'+esc(l.id)+'" aria-pressed="'+(mode==='list:'+l.id)+'">'+esc(l.title||'Liste')+'</button>').join('')+'</div><button class="btn sm ghost" data-act="listnew">+ Liste</button></div>';
  if(mode==='anw')return h+viewAttendance(studs);
  if(mode.startsWith('list:'))return h+viewList(lists.find(l=>'list:'+l.id===mode),studs);
  const cols=S.columns.slice().sort((a,b)=>(a.date+(a.created||''))<(b.date+(b.created||''))?-1:1);
  h+='<div class="gbtools" style="margin-bottom:10px"><button class="btn primary sm" data-act="mahute">+ Mitarbeit heute</button><button class="btn sm" data-act="colform" data-k="pruefung">+ Schularbeit / Test</button><button class="btn sm" data-act="colform" data-k="hue">+ Hausübung</button><button class="btn sm" data-act="colform" data-k="check">+ Checkliste</button><span class="spacer"></span><button class="btn sm ghost" data-act="rosteredit">Schülerliste</button><button class="btn sm ghost" data-act="csv">CSV exportieren</button></div>';
  const F=S.nbForm;
  if(F)h+='<div class="card inlineform" style="margin-bottom:12px"><label class="f">'+(F.id?'Spalte bearbeiten':KINDNAMES[F.kind])+'<input type="text" id="cftitle" value="'+esc(F.title||'')+'" placeholder="'+({pruefung:'1. Schularbeit',hue:'HÜ Kommaregeln',check:'Elternbrief unterschrieben',mitarbeit:'Mitarbeit'}[F.kind])+'"></label><label class="f">Datum<input type="date" id="cfdate" value="'+esc(F.date||todayStr())+'"></label>'+(F.kind==='pruefung'?'<label class="f">Gewicht<input type="number" id="cfweight" min="0.5" step="0.5" value="'+esc(F.weight||1)+'"></label>':'<span></span>')+'<button class="btn primary" data-act="colsave">Speichern</button><div style="display:flex;gap:6px">'+(F.id?'<button class="btn ghost danger" data-act="coldel">'+(F.confirm?'Wirklich?':'Löschen')+'</button>':'')+'<button class="btn ghost" data-act="colcancel">Abbrechen</button></div></div>';
  h+='<div class="gbwrap"><table class="gb"><thead><tr><th class="st">Schüler:in</th>';
  cols.forEach(c=>{h+='<th><button class="colh" data-act="coledit" data-id="'+esc(c.id)+'" title="Bearbeiten"><span class="k k-'+c.kind+'">'+KINDS[c.kind]+'</span><span class="t">'+esc(c.title||KINDNAMES[c.kind])+'</span><span class="dd">'+dm(c.date)+(c.kind==='pruefung'&&c.weight&&c.weight!=1?' ×'+c.weight:'')+'</span></button></th>'});
  h+='<th class="sum">Ø Note</th><th class="sum">+ / ~ / −</th><th class="sum">HÜ fehlt</th></tr></thead><tbody>';
  studs.forEach(s=>{
    h+='<tr><td class="st">'+esc(s.code)+'</td>';let gs=0,gw=0,p=0,t=0,m=0,hm=0;
    cols.forEach(c=>{const v=(c.values||{})[s.id]||'';
      if(c.kind==='pruefung'){const n=parseFloat(String(v).replace(',','.'));if(n>=1&&n<=5){gs+=n*(c.weight||1);gw+=(c.weight||1)}h+='<td><input class="gi" inputmode="decimal" id="g-'+c.id+'-'+s.id+'" data-col="'+esc(c.id)+'" data-sid="'+esc(s.id)+'" value="'+esc(v)+'" aria-label="Note '+esc(s.code)+'"></td>'}
      else{if(c.kind==='mitarbeit'){if(v==='+')p++;if(v==='~')t++;if(v==='−')m++}if(c.kind==='hue'&&v==='✗')hm++;
        const cl={'+':'v-plus','~':'v-tilde','−':'v-minus','✓':'v-yes','✗':'v-no'}[v]||'';
        h+='<td><button class="gc '+cl+'" data-act="cyc" data-col="'+esc(c.id)+'" data-sid="'+esc(s.id)+'" aria-label="'+esc(s.code)+'">'+esc(v)+'</button></td>'}
    });
    h+='<td class="sum"><b>'+(gw?(gs/gw).toFixed(2).replace('.',','):'–')+'</b></td><td class="sum">'+p+' / '+t+' / '+m+'</td><td class="sum">'+(hm||'–')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(!cols.length)h+='<p class="hint" style="margin-top:10px">Lege oben die erste Spalte an. Bei Mitarbeit, Hausübung und Checkliste tippst du die Felder einfach an: Mitarbeit wechselt zwischen +, ~ und −, Hausübung zwischen ✓ und ✗.</p>';
  else h+='<p class="hint" style="margin-top:10px">Spaltenkopf antippen zum Bearbeiten oder Löschen. Ø Note ist nach Gewicht berechnet.</p>';
  return h;
}

function exportListCsv(L){
  const studs=(S.roster&&S.roster.students)||[];const cols=listCols(L);const opts=L.options||[];const V=L.values||{};
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

  studs.forEach(s=>{const cnt={};const cells=cols.map(c=>{const o=opts.find(x=>x.id===(V[c.id]||{})[s.id]);if(o)cnt[o.id]=(cnt[o.id]||0)+1;return o?o.label:''});rows.push([s.code].concat(cells).concat(opts.map(o=>cnt[o.id]||0)))});

}

/* Alle Stunden einer Klasse vom Schulbeginn bis heute (plus spätere mit Einträgen) */
function attLessonList(c){
  const docs=S.attLessons||{};const st=S.settings;const today=todayStr();const end=today<st.yearEnd?today:st.yearEnd;const out=[];const seen={};
  let d=st.yearStart;
  while(d<=end){const dow=(parse(d).getDay()+6)%7;
    if(dow<5&&!holidayOf(d)){for(const p of st.periods){const k=d+'_'+p.n;const L=docs[k];
      if(L){if(L.classId===c&&L.status!=='frei'&&L.status!=='entfaellt'){out.push({key:k,date:d,period:p.n,att:L.att||{}});seen[k]=1}}
      else{const sl=slotFor(d,p.n);if(sl&&sl.c===c){out.push({key:k,date:d,period:p.n,att:{}});seen[k]=1}}}}
    d=addDays(d,1)}
  Object.keys(docs).forEach(k=>{const L=docs[k];if(!seen[k]&&L.classId===c&&L.att&&Object.keys(L.att).length&&L.status!=='frei')out.push({key:k,date:L.date,period:L.period,att:L.att})});
  out.sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0);
  return out;
}

async function backup(){
  if(!S.db){toast('Keine Verbindung zum Speicher.');return}
  try{
    const all={exported:new Date().toISOString(),docs:{}};
    for(const p of ['plan/settings','plan/timetable']){const s=await S.db.doc(p).get();if(s.exists)all.docs[p]=s.data()}
    for(const c of ['lessons','events','yearplan','roster','columns','templates','lists']){const q=await S.db.collection(c).get();q.docs.forEach(d=>all.docs[c+'/'+d.id]=d.data())}
    download('Planbuch_Sicherung_'+todayStr()+'.json',JSON.stringify(all,null,1));
  }catch(e){report(e)}
}
async function restore(file){
  if(!S.db){toast('Keine Verbindung zum Speicher.');return}
  try{const j=JSON.parse(await file.text());const docs=j.docs||{};const keys=Object.keys(docs);let n=0;setStatus('Spielt Sicherung ein …');
    for(const k of keys){if(!/^(plan|lessons|events|yearplan|roster|columns|templates|lists)\/[\w.:@+~-]+$/.test(k))continue;await S.db.doc(k).set(docs[k]);n++}
    toast(n+' Einträge wiederhergestellt.');setStatus('Alles gespeichert')}catch(e){toast('Die Datei konnte nicht gelesen werden.');report(e)}
}

      const students=lines.map(code=>{const o=old.find(s=>s.code===code);return o||{id:'s'+uid(),code}});
      S.roster={students};S.editRoster=false;render();const c=S.nbClass;write('roster/'+c,()=>S.db.doc('roster/'+c).set({classId:c,students}));break}
    case 'mahute':{const t=todayStr();const c=S.nbClass;const n=S.columns.filter(x=>x.kind==='mitarbeit'&&x.date===t).length;const col={classId:c,kind:'mitarbeit',title:'Mitarbeit'+(n?' '+(n+1):''),date:t,weight:1,values:{},created:new Date().toISOString()};const id='c-'+uid();S.columns.push(Object.assign({id},col));render();write('columns/'+id,()=>S.db.doc('columns/'+id).set(col));break}
    case 'colform':S.nbForm={kind:b.dataset.k,date:todayStr(),weight:1};render();{const el=$('#cftitle');if(el)el.focus()}break;
    case 'coledit':{const c=S.columns.find(x=>x.id===b.dataset.id);if(c){S.nbForm={id:c.id,kind:c.kind,title:c.title,date:c.date,weight:c.weight};render()}break}
    case 'colcancel':S.nbForm=null;render();break;
    case 'colsave':{const F=S.nbForm;const title=$('#cftitle').value.trim()||KINDNAMES[F.kind];const date=$('#cfdate').value||todayStr();const w=$('#cfweight')?parseFloat($('#cfweight').value)||1:1;
      if(F.id){const c=S.columns.find(x=>x.id===F.id);Object.assign(c,{title,date,weight:w});S.nbForm=null;render();write('columns/'+F.id,()=>S.db.doc('columns/'+F.id).update({title,date,weight:w}))}
      else{const col={classId:S.nbClass,kind:F.kind,title,date,weight:w,values:{},created:new Date().toISOString()};const id='c-'+uid();S.columns.push(Object.assign({id},col));S.nbForm=null;render();write('columns/'+id,()=>S.db.doc('columns/'+id).set(col))}break}
    case 'coldel':{const F=S.nbForm;if(!F.confirm){F.confirm=true;render();break}S.columns=S.columns.filter(x=>x.id!==F.id);S.nbForm=null;render();write('columns/'+F.id,()=>S.db.doc('columns/'+F.id).delete());break}
    case 'cyc':{const c=S.columns.find(x=>x.id===b.dataset.col);if(!c)break;const cyc=CYCLE[c.kind];const cur=(c.values||{})[b.dataset.sid]||'';const nx=cyc[(cyc.indexOf(cur)+1)%cyc.length];setCell(c.id,b.dataset.sid,nx);b.textContent=nx;b.className='gc '+({'+':'v-plus','~':'v-tilde','−':'v-minus','✓':'v-yes','✗':'v-no'}[nx]||'');clearTimeout(S._rt);S._rt=setTimeout(()=>{if(S.view==='noten')render()},1200);break}
    case 'csv':exportCsv();break;
    case 'clsadd':S.settings.classes.push({id:'k'+uid(),name:'',subject:'',color:PALETTE[S.settings.classes.length%PALETTE.length]});saveSettings();render();break;
    case 'clsdel':{const i=+b.dataset.i;if(S.confirmCls!==i){S.confirmCls=i;render();toast('Nochmal tippen zum Entfernen.');break}S.confirmCls=null;S.settings.classes.splice(i,1);saveSettings(100);render();break}
    case 'peradd':{const P=S.settings.periods;const last=P[P.length-1];P.push({n:last?last.n+1:1,start:last?last.end:'08:00',end:''});saveSettings();render();break}
    case 'perdel':S.settings.periods.splice(+b.dataset.i,1);saveSettings();render();break;
    case 'holadd':S.settings.holidays.push({from:todayStr(),to:todayStr(),label:'Schulautonom frei'});saveSettings();render();break;
    case 'holdel':S.settings.holidays.splice(+b.dataset.i,1);saveSettings();render();break;
    case 'backup':backup();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(S.drawer&&t.closest('.drawer')){
    if(t.id==='pkq'){S.drawer.picker.q=t.value;const pos=t.selectionStart;readLesson();drawLesson();const n=$('#pkq');n.focus();n.setSelectionRange(pos,pos);return}
    if(t.id==='tplname')return;
    if(t.classList.contains('attmin')){const d=S.drawer.data;const a=d.att[t.dataset.sid];const m=parseInt(t.value);if(a&&m>0){d.att=Object.assign({},d.att,{[t.dataset.sid]:Object.assign({},a,{min:m})})}saveLesson(800);return}
    if(t.dataset.l==='url'){const a=t.parentElement.querySelector('.openlink');a.href=safeUrl(t.value);a.hidden=!t.value}
    if(t.dataset.f==='min'){readLesson();const m=S.drawer.data.flow.reduce((a,r)=>a+(parseInt(r.min)||0),0);$('#summin').textContent=m+' min'}
    saveLesson();return;
  }
  if(t.dataset.week){saveYear();return}
  if(t.dataset.lf){const L=curList();if(L){L.title=t.value;saveListMeta(L)}return}
  if(t.dataset.lo!=null&&t.tagName==='INPUT'){const L=curList();if(L){L.options=L.options.map((o,i)=>i===+t.dataset.lo?Object.assign({},o,{label:t.value}):o);saveListMeta(L)}return}
  if(t.dataset.cls!=null){if(t.type==='checkbox')return;S.settings.classes[+t.dataset.cls][t.dataset.k]=t.value;saveSettings();return}
  if(t.dataset.per!=null){S.settings.periods[+t.dataset.per][t.dataset.k]=t.value;saveSettings();return}
  if(t.dataset.hol!=null){S.settings.holidays[+t.dataset.hol][t.dataset.k]=t.value;saveSettings();return}
  if(t.id==='ystart'){S.settings.yearStart=t.value;saveSettings();return}
  if(t.id==='yend'){S.settings.yearEnd=t.value;saveSettings();return}
  if(t.id==='abstart'){S.settings.abStart=t.value;saveSettings();return}
  if(t.classList.contains('gi')){const v=t.value.trim();clearTimeout(t._t);t._t=setTimeout(()=>setCell(t.dataset.col,t.dataset.sid,v),600);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(S.drawer&&t.closest('.drawer')){if(t.classList.contains('attmin'))return;if(t.id==='lclass'){readLesson();drawLesson();ensureDrawerRoster()}saveLesson(200);return}
  if(t.dataset.lo!=null&&t.tagName==='SELECT'){const L=curList();if(L){L.options=L.options.map((o,i)=>i===+t.dataset.lo?Object.assign({},o,{[t.dataset.k]:t.value}):o);saveListMeta(L);render()}return}
  if(t.dataset.lf||t.dataset.lo!=null){render();return}
  if(t.dataset.cls!=null&&t.type==='checkbox'){const c=S.settings.classes[+t.dataset.cls];c.att=t.checked;saveSettings(100);if(c.id===S.nbClass)subNotebook();render();return}
  if(t.dataset.tt){const T=t.dataset.tt;S.tt[T]=S.tt[T]||{};if(t.value)S.tt[T][t.dataset.k]={c:t.value};else delete S.tt[T][t.dataset.k];saveTT();return}
  if(t.id==='abweeks'){S.settings.abWeeks=t.checked;if(t.checked&&!S.tt.B||t.checked&&!Object.keys(S.tt.B||{}).length){S.tt.B=JSON.parse(JSON.stringify(S.tt.A||{}));saveTT()}saveSettings(100);render();return}
  if(t.dataset.cls!=null||t.dataset.hol!=null||t.dataset.per!=null){flush();render();return}
  if(t.id==='restore'&&t.files&&t.files[0]){restore(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.lpick){S.lpick=null;drawPicker();render();return}if(S.drawer)closeDrawer()});
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});

render();
connect();
})();
</script>
